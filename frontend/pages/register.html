<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | PhishGuard</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <style>

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: #111722;
            border: 1px solid #202938;
            border-radius: 18px;
            padding: 35px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 16px;
            background: #4d8cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .auth-logo h1 {
            margin: 0;
            font-size: 28px;
            color: #ffffff;
        }

        .auth-logo p {
            margin-top: 8px;
            color: #8993a4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b8c1d1;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #293449;
            border-radius: 10px;
            background: #0b1018;
            color: #ffffff;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #4d8cff;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4d8cff;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: rgba(255, 77, 103, 0.12);
            border: 1px solid #ff4d67;
            color: #ff7b8e;
        }

        .message.success {
            display: block;
            background: rgba(38, 208, 124, 0.12);
            border: 1px solid #26d07c;
            color: #26d07c;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #8993a4;
            font-size: 14px;
        }

        .auth-footer a {
            color: #4d8cff;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #8993a4;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #ffffff;
        }

    </style>

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">

                <div class="auth-icon">
                    🛡️
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Join PhishGuard Threat Intelligence
                </p>

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        minlength="2"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                    id="registerBtn"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <a
                href="../index.html"
                class="back-link"
            >
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <script>

        const form =
            document.getElementById(
                "registerForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const registerBtn =
            document.getElementById(
                "registerBtn"
            );


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                hideMessage();


                // Password confirmation

                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                // Password length

                if (
                    password.length < 6
                ) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;

                }


                registerBtn.disabled =
                    true;

                registerBtn.textContent =
                    "Creating Account...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:3001/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name,
                                        email,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.error ||
                            "Registration failed."
                        );

                    }


                    showMessage(
                        "Account created successfully! Redirecting to login...",
                        "success"
                    );


                    form.reset();


                    setTimeout(
                        () => {

                            window.location.href =
                                "login.html";

                        },
                        1200
                    );


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    registerBtn.disabled =
                        false;

                    registerBtn.textContent =
                        "Create Account";

                }

            }
        );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `message ${type}`;

        }


        function hideMessage() {

            message.textContent =
                "";

            message.className =
                "message";

        }

    </script>

</body>

</html>
