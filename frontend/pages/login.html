<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | PhishGuard</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: #111722;
            border: 1px solid #202938;
            border-radius: 18px;
            padding: 35px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 16px;
            background: #4d8cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .auth-logo h1 {
            margin: 0;
            font-size: 28px;
            color: #ffffff;
        }

        .auth-logo p {
            margin-top: 8px;
            color: #8993a4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b8c1d1;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #293449;
            border-radius: 10px;
            background: #0b1018;
            color: #ffffff;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #4d8cff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4d8cff;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: rgba(255, 77, 103, 0.12);
            border: 1px solid #ff4d67;
            color: #ff7b8e;
        }

        .message.success {
            display: block;
            background: rgba(38, 208, 124, 0.12);
            border: 1px solid #26d07c;
            color: #26d07c;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #8993a4;
            font-size: 14px;
        }

        .auth-footer a {
            color: #4d8cff;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #8993a4;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">

                <div class="auth-icon">
                    🛡️
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your PhishGuard account
                </p>

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <a
                href="../index.html"
                class="back-link"
            >
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <script>

        const form =
            document.getElementById(
                "loginForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                hideMessage();


                loginBtn.disabled =
                    true;

                loginBtn.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:3001/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.error ||
                            "Login failed."
                        );

                    }


                    /*
                     * Store JWT locally.
                     *
                     * We will use this token later
                     * to protect the dashboard and
                     * associate scans with the user.
                     */

                    localStorage.setItem(
                        "phishguard_token",
                        data.token
                    );


                    localStorage.setItem(
                        "phishguard_user",
                        JSON.stringify(
                            data.user
                        )
                    );


                    showMessage(
                        `Welcome back, ${data.user.name}! Redirecting...`,
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "../index.html";

                        },
                        800
                    );


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "Login";

                }

            }
        );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `message ${type}`;

        }


        function hideMessage() {

            message.textContent =
                "";

            message.className =
                "message";

        }

    </script>

</body>

</html>
